name: Capturar HTML

# Guarda el HTML público de las URLs de docs/captura/urls.txt (diagnóstico de tema y SEO).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/captura/urls.txt"]

permissions:
  contents: write

jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p docs/captura/html
          n=0
          while read -r u; do
            [ -z "$u" ] && continue; n=$((n+1))
            curl -sL -A "Mozilla/5.0 ubicaweb-captura" "$u" -o "docs/captura/html/$n.html"
            echo "$n $u" >> docs/captura/html/indice.txt
          done < docs/captura/urls.txt
          git config user.name "ubicaweb-bot"; git config user.email "ubicaweb-bot@users.noreply.github.com"
          git add docs/captura; git commit -m "Captura HTML [skip ci]" || exit 0
          git pull --rebase -q origin main && git push -q origin HEAD:main
