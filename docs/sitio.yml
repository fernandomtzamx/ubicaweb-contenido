# Configuración del sitio que el agente puede aplicar con rol Editor.
# Se aplica con: Actions > Publicar en WordPress > Run workflow > setup
# (menús, tagline, header y footer requieren administrador: se hacen a mano).

# Página que se muestra como portada (slug). Requiere usuario administrador.
portada: inicio

# Página de entradas: /blog/ usa la plantilla de listado del tema (slug o id; 0 = ninguna).
pagina_entradas: blog

# Menú principal (id 3 "Principal"; reemplaza al menú demo de Vault en la ubicación primary).
menu:
  id: 3
  ubicacion: primary
  items:
    - {titulo: "Servicios", url: "/#servicios"}
    - {titulo: "Precios", url: "/#precios"}
    - {titulo: "Blog", url: "/blog/"}
    - {titulo: "Diccionario SEO local", url: "/diccionario-seo-local/"}
    - {titulo: "Contacto", url: "/contacto/"}

# Nota al pie de cada entrada. Déjala vacía ("") para no poner ninguna.
firma_articulo: ""

# Perfil público del usuario del agente (soporte). Descomenta y ajusta si quieres firmar con él.
# autor:
#   first_name: ""
#   last_name: ""
#   name: ""
#   nickname: ""
#   description: ""

# Categorías del blog: se crean o actualizan con nombre y descripción.
# Pendiente de definir los pilares editoriales de UbicaWeb.
categorias: []

# Páginas o entradas a mandar a la papelera, por id y slug (se confirma el slug antes de borrar).
borrar: []
